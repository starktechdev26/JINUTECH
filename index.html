<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JINUTECH | Cyber-Physical Environment Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-green: #00ffaa;
            --neon-amber: #ffaa00;
            --neon-red: #ff0044;
            --panel-bg: rgba(4, 11, 24, 0.92);
            --border-glow: rgba(0, 243, 255, 0.4);
            --font-hud: 'Share Tech Mono', monospace;
            --font-title: 'Orbitron', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #02050b;
            font-family: var(--font-hud);
            color: #d8ecff;
        }

        /* --- PROCEDURAL LIVE SKY --- */
        .sky-viewport {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: linear-gradient(180deg, #104882 0%, #2f7ec9 45%, #76b5eb 80%, #b8dbf9 100%);
            transition: background 1.5s ease, filter 0.8s ease;
        }

        body.sky-evening .sky-viewport {
            background: linear-gradient(180deg, #161033 0%, #4a214d 38%, #a04351 70%, #f08953 100%);
        }

        body.sky-night .sky-viewport {
            background: linear-gradient(180deg, #020611 0%, #061426 50%, #0d2745 100%);
        }

        /* Weather State Lighting */
        body.weather-clear .sky-viewport { filter: brightness(1.05) saturate(1.1); }
        body.weather-cloudy .sky-viewport { filter: saturate(0.85) brightness(0.88); }
        body.weather-rain .sky-viewport { filter: brightness(0.62) saturate(0.55); }

        /* Celestial Bodies */
        .celestial-sun, .celestial-moon {
            position: fixed;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
            will-change: transform, opacity;
            transition: opacity 1s ease;
        }

        .celestial-sun {
            width: 88px;
            height: 88px;
            top: 15%;
            right: 17%;
            background: radial-gradient(circle, #ffffff 12%, #fff1a8 32%, #ffaa22 75%, rgba(255,160,0,0) 100%);
            box-shadow: 0 0 45px rgba(255, 175, 40, 0.8), 0 0 95px rgba(255, 150, 0, 0.4);
            animation: sunPulse 6s ease-in-out infinite alternate;
        }

        .celestial-moon {
            width: 74px;
            height: 74px;
            top: 15%;
            left: 17%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d8e5f2 50%, #90a8c0 100%);
            box-shadow: 0 0 35px rgba(215, 235, 255, 0.7), inset -8px -6px 0 rgba(15, 30, 50, 0.35);
            opacity: 0;
            animation: sunPulse 7s ease-in-out infinite alternate;
        }

        body.sky-night .celestial-sun, body.sky-evening .celestial-sun { opacity: 0.15; }
        body.sky-night .celestial-moon, body.sky-evening .celestial-moon { opacity: 0.95; }
        body.weather-rain .celestial-sun, body.weather-rain .celestial-moon { opacity: 0.08; }

        @keyframes sunPulse {
            0% { transform: scale(1) translate3d(0, 0, 0); }
            100% { transform: scale(1.04) translate3d(8px, -6px, 0); }
        }

        /* --- PROCEDURAL CLOUD STAGE --- */
        .cloud-stage {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .cloud-mass {
            position: absolute;
            width: 220vw;
            height: 44vh;
            top: 4%;
            left: -30vw;
            filter: url(#realistic-clouds) blur(1px);
            opacity: 0.55;
            transition: opacity 1.2s ease, filter 1.2s ease;
            animation: cloudDriftSlow 75s linear infinite;
        }

        .cloud-mass.layer-foreground {
            top: 12%;
            opacity: 0.4;
            animation: cloudDriftFast 45s linear infinite;
            filter: url(#realistic-clouds) blur(2px);
        }

        /* Weather-specific Cloud Opacity & Darkness */
        body.weather-clear .cloud-mass {
            opacity: 0.5;
            filter: url(#realistic-clouds) brightness(1.05) blur(1px);
        }
        body.weather-clear .cloud-mass.layer-foreground {
            opacity: 0.35;
        }

        body.weather-cloudy .cloud-mass {
            opacity: 0.92;
            filter: url(#realistic-clouds) brightness(0.82) blur(1px);
        }
        body.weather-cloudy .cloud-mass.layer-foreground {
            opacity: 0.8;
            filter: url(#realistic-clouds) brightness(0.78) blur(2px);
        }

        body.weather-rain .cloud-mass {
            opacity: 0.98;
            filter: url(#realistic-clouds) brightness(0.42) blur(1px);
        }
        body.weather-rain .cloud-mass.layer-foreground {
            opacity: 0.9;
            filter: url(#realistic-clouds) brightness(0.38) blur(2px);
        }

        body.sky-night .cloud-mass { filter: url(#realistic-clouds) brightness(0.32); }

        @keyframes cloudDriftSlow { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-35vw, 0, 0); } }
        @keyframes cloudDriftFast { 0% { transform: translate3d(-30vw, 0, 0); } 100% { transform: translate3d(15vw, 0, 0); } }

        /* --- CLOUD-ORIGIN REALISTIC RAIN CANVAS --- */
        /* Positioned strictly starting from cloud underside (~18vh) to bottom */
        .rain-canvas-stage {
            position: fixed;
            top: 18vh;
            left: 0;
            width: 100vw;
            height: 82vh;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.weather-rain .rain-canvas-stage {
            opacity: 1;
        }

        /* --- VISIBLE MOUNTAIN RIDGES --- */
        .mountain-container {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 66px;
            width: 100%;
            height: 38vh;
            z-index: 5;
            pointer-events: none;
        }

        .mountain-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- TWO-WAY TRACKS & HIGHWAY --- */
        .transit-infrastructure {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 82px;
            z-index: 6;
            pointer-events: none;
        }

        .rail-corridor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 28px;
            background: #061018;
            border-top: 1px solid rgba(0, 243, 255, 0.25);
        }

        .rail-track {
            position: absolute;
            left: 0;
            width: 100%;
            height: 5px;
            border-top: 1px solid #6b91a6;
            border-bottom: 1px solid #6b91a6;
            background: repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(0, 243, 255, 0.22) 10px, rgba(0, 243, 255, 0.22) 13px);
        }

        .rail-upper { top: 6px; }
        .rail-lower { top: 18px; }

        .train-ltr {
            position: absolute;
            top: -4px;
            left: -260px;
            width: 220px;
            height: 10px;
            display: flex;
            gap: 2px;
            animation: trainLTR 15s linear infinite;
        }

        .train-rtl {
            position: absolute;
            top: 8px;
            left: 100vw;
            width: 220px;
            height: 10px;
            display: flex;
            gap: 2px;
            animation: trainRTL 18s linear infinite 2s;
        }

        .train-car {
            flex: 1;
            height: 100%;
            background: linear-gradient(180deg, #00f3ff, #005588);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.45);
            font-size: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 800;
        }

        .train-engine-right {
            width: 30px;
            background: #ffaa00;
            box-shadow: 0 0 10px #ffaa00;
            border-radius: 2px 5px 2px 2px;
        }

        .train-engine-left {
            width: 30px;
            background: #00ffaa;
            box-shadow: 0 0 10px #00ffaa;
            border-radius: 5px 2px 2px 2px;
        }

        @keyframes trainLTR {
            0% { transform: translateX(0); }
            100% { transform: translateX(135vw); }
        }

        @keyframes trainRTL {
            0% { transform: translateX(0); }
            100% { transform: translateX(-135vw); }
        }

        .highway-road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 54px;
            background: #081119;
            border-top: 2px solid rgba(0, 243, 255, 0.35);
        }

        .highway-divider {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 2px;
            background: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255, 255, 255, 0.45) 20px, rgba(255, 255, 255, 0.45) 40px);
            transform: translateY(-50%);
        }

        .lane-upper {
            position: absolute;
            top: 4px;
            left: 0;
            width: 100%;
            height: 20px;
            overflow: hidden;
        }

        .lane-lower {
            position: absolute;
            bottom: 4px;
            left: 0;
            width: 100%;
            height: 20px;
            overflow: hidden;
        }

        .vehicle-car {
            position: absolute;
            top: 5px;
            width: 34px;
            height: 9px;
            border-radius: 3px;
            box-shadow: 0 0 10px currentColor;
        }

        .v-upper-rtl {
            left: 100vw;
            background: #00ffaa;
            color: #00ffaa;
            animation: laneRTL 11s linear infinite;
        }

        .v-lower-ltr {
            left: -50px;
            background: #ff0044;
            color: #ff0044;
            animation: laneLTR 13s linear infinite 2s;
        }

        @keyframes laneRTL {
            0% { transform: translateX(0); }
            100% { transform: translateX(-130vw); }
        }

        @keyframes laneLTR {
            0% { transform: translateX(0); }
            100% { transform: translateX(130vw); }
        }

        /* --- TELEMETRY HEADER --- */
        .hud-header {
            position: fixed;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: rgba(3, 10, 22, 0.84);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .brand-node h1 {
            font-family: var(--font-title);
            font-size: clamp(1.2rem, 3.8vw, 1.75rem);
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 14px rgba(0, 243, 255, 0.55);
        }

        .brand-node span {
            display: block;
            color: var(--neon-green);
            font-size: clamp(0.78rem, 2vw, 0.95rem);
            letter-spacing: 0.8px;
            margin-top: 2px;
        }

        .telemetry-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .telemetry-item {
            background: rgba(0, 243, 255, 0.06);
            border: 1px solid rgba(0, 243, 255, 0.24);
            padding: 6px 12px;
            border-radius: 7px;
            min-width: 120px;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s;
        }

        .telemetry-item:hover {
            background: rgba(0, 243, 255, 0.14);
            border-color: var(--neon-cyan);
        }

        .telemetry-item span {
            display: block;
            font-size: 0.65rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
        }

        .telemetry-item b {
            display: block;
            color: #ffffff;
            font-size: clamp(0.85rem, 2.2vw, 1.02rem);
            font-family: var(--font-title);
            margin-top: 2px;
        }

        /* Center Greeting & Progress */
        .center-announcer {
            position: fixed;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            pointer-events: none;
            width: 100%;
            padding: 0 16px;
        }

        .greeting-sub {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .greeting-main {
            font-family: var(--font-title);
            font-size: clamp(1.8rem, 5.5vw, 3.4rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9), 0 0 24px rgba(0, 243, 255, 0.7);
            letter-spacing: 2px;
            line-height: 1.15;
        }

        .vis-anim-wrap {
            width: min(220px, 60vw);
            height: 8px;
            margin: 12px auto 0;
            border-radius: 999px;
            background: rgba(2, 10, 20, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.45);
            overflow: hidden;
            position: relative;
        }

        .vis-anim-sweep {
            position: absolute;
            top: 0;
            left: -35%;
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-green), transparent);
            animation: sweepBar 2.1s ease-in-out infinite;
        }

        @keyframes sweepBar {
            0% { transform: translateX(0); }
            100% { transform: translateX(385%); }
        }

        .countdown-strip {
            margin: 14px auto 0;
            width: min(200px, 50vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .countdown-label {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
        }

        .countdown-bar-bg {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        .countdown-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
            animation: timerFill 8s linear forwards;
        }

        @keyframes timerFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- CIRCULAR LAUNCH BUTTON (ON MOUNTAIN) --- */
        .circular-launcher {
            position: fixed;
            bottom: 92px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .core-orb-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.28) 0%, rgba(4, 11, 24, 0.95) 75%);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 24px rgba(0, 243, 255, 0.65), inset 0 0 14px rgba(0, 243, 255, 0.4);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .core-orb-btn:hover, .core-orb-btn:active {
            transform: scale(1.08);
            box-shadow: 0 0 32px var(--neon-cyan), inset 0 0 22px var(--neon-green);
            border-color: var(--neon-green);
        }

        .orb-icon {
            font-size: 19px;
            color: var(--neon-cyan);
            transition: transform 0.35s ease;
        }

        .orb-tag {
            font-size: 8px;
            letter-spacing: 1px;
            color: var(--neon-green);
            margin-top: 2px;
            font-weight: bold;
        }

        .launcher-menu {
            position: absolute;
            bottom: 78px;
            width: min(92vw, 370px);
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 15px;
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 243, 255, 0.3);
            display: none;
            flex-direction: column;
            gap: 9px;
            transform-origin: bottom center;
            animation: menuPopup 0.25s ease forwards;
        }

        .launcher-menu.open { display: flex; }

        @keyframes menuPopup {
            from { opacity: 0; transform: scale(0.88) translateY(14px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .menu-title {
            font-size: 0.72rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-align: center;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 6px;
        }

        .launch-btn {
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #ffffff;
            padding: 11px 14px;
            border-radius: 8px;
            font-family: var(--font-hud);
            font-size: 0.82rem;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .launch-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        .launch-btn.secure {
            border-color: rgba(255, 0, 68, 0.5);
            background: rgba(255, 0, 68, 0.08);
        }

        .launch-btn.secure:hover {
            background: var(--neon-red);
            color: #fff;
        }

        .store-subdrawer {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 2px;
            padding: 8px;
            background: rgba(0, 5, 12, 0.75);
            border-radius: 6px;
            border: 1px dashed rgba(0, 243, 255, 0.3);
        }

        .store-subdrawer.active { display: flex; }

        .sub-site-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.22);
            color: #aae0fa;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 0.74rem;
            cursor: pointer;
            text-align: left;
        }

        .sub-site-btn:hover {
            background: rgba(0, 255, 170, 0.2);
            color: #fff;
        }

        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 5, 12, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .auth-card {
            width: min(92vw, 360px);
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            border-radius: 10px;
            padding: 22px;
            text-align: center;
        }

        .auth-card input {
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid var(--border-glow);
            padding: 11px;
            text-align: center;
            font-family: var(--font-hud);
            font-size: 1.05rem;
            color: var(--neon-cyan);
            margin: 14px 0;
            letter-spacing: 3px;
            outline: none;
            border-radius: 4px;
        }
    </style>
</head>
<!-- Initialized by default with Clear Clouds -->
<body class="sky-day weather-clear">

    <div class="sky-viewport" id="sky-viewport"></div>
    <div class="celestial-sun"></div>
    <div class="celestial-moon"></div>

    <!-- Procedural Vector Clouds -->
    <div class="cloud-stage">
        <svg style="position: absolute; width: 0; height: 0;">
            <filter id="realistic-clouds" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="42" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="65" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </svg>

        <svg class="cloud-mass" viewBox="0 0 1200 400" preserveAspectRatio="none">
            <defs>
                <radialGradient id="cloudGrad1" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                    <stop offset="55%" stop-color="#eaf3fc" stop-opacity="0.82"/>
                    <stop offset="100%" stop-color="#cfdfee" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <ellipse cx="250" cy="180" rx="240" ry="110" fill="url(#cloudGrad1)"/>
            <ellipse cx="600" cy="160" rx="320" ry="140" fill="url(#cloudGrad1)"/>
            <ellipse cx="980" cy="190" rx="260" ry="120" fill="url(#cloudGrad1)"/>
        </svg>

        <svg class="cloud-mass layer-foreground" viewBox="0 0 1200 400" preserveAspectRatio="none">
            <defs>
                <radialGradient id="cloudGrad2" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
                    <stop offset="65%" stop-color="#dfeefa" stop-opacity="0.55"/>
                    <stop offset="100%" stop-color="#bed6ec" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <ellipse cx="380" cy="220" rx="310" ry="120" fill="url(#cloudGrad2)"/>
            <ellipse cx="820" cy="200" rx="340" ry="130" fill="url(#cloudGrad2)"/>
        </svg>
    </div>

    <!-- Realistic Rain Canvas with Cloud-Underbelly Emitters & Splashes -->
    <canvas id="rain-canvas" class="rain-canvas-stage"></canvas>

    <!-- Mountain Silhouette -->
    <div class="mountain-container">
        <svg class="mountain-svg" viewBox="0 0 1440 450" preserveAspectRatio="none">
            <path d="M0,180 Q220,90 460,160 T920,110 T1440,150 L1440,450 L0,450 Z" fill="#183a48" opacity="0.45" />
            <path d="M0,230 Q160,130 380,210 T760,150 T1140,200 T1440,160 L1440,450 L0,450 Z" fill="#102f35" opacity="0.75" />
            <path d="M0,270 C220,190 380,290 640,210 C880,140 1080,260 1440,200 L1440,450 L0,450 Z" fill="#0b2424" opacity="0.9" />
            <path d="M0,320 C320,240 620,330 920,270 C1200,210 1340,300 1440,250 L1440,450 L0,450 Z" fill="#051614" />
        </svg>
    </div>

    <!-- Trains & Highway -->
    <div class="transit-infrastructure">
        <div class="rail-corridor">
            <div class="rail-track rail-upper"></div>
            <div class="train-ltr">
                <div class="train-car">NET</div>
                <div class="train-car">HTML</div>
                <div class="train-car">CSS</div>
                <div class="train-car train-engine-right">SYS</div>
            </div>

            <div class="rail-track rail-lower"></div>
            <div class="train-rtl">
                <div class="train-car train-engine-left">AI</div>
                <div class="train-car">JS</div>
                <div class="train-car">PY</div>
                <div class="train-car">SEC</div>
            </div>
        </div>

        <div class="highway-road">
            <div class="lane-upper">
                <div class="vehicle-car v-upper-rtl"></div>
            </div>
            <div class="highway-divider"></div>
            <div class="lane-lower">
                <div class="vehicle-car v-lower-ltr"></div>
            </div>
        </div>
    </div>

    <!-- HUD Telemetry Header -->
    <header class="hud-header">
        <div class="brand-node">
            <h1>JINUTECH</h1>
            <span id="date-full-display">-- ---------- ----</span>
        </div>

        <div class="telemetry-cluster">
            <div class="telemetry-item">
                <span>12H TIME</span>
                <b id="time-12h-display">--:--:-- --</b>
            </div>
            <div class="telemetry-item">
                <span>LOC &amp; DIR</span>
                <b id="loc-dir-display">Nelamangala · --°</b>
            </div>
            <!-- Tap to toggle weather sequence: Clear Clouds -> Cloudy -> Rain -->
            <div class="telemetry-item" onclick="cycleWeather()" title="Tap to toggle weather">
                <span>WEATHER (TAP)</span>
                <b id="weather-display">Clear Clouds</b>
            </div>
        </div>
    </header>

    <!-- Center Visitor Greeting + 8-Second Auto Redirect -->
    <div class="center-announcer">
        <div class="greeting-sub">// VISITOR TELEMETRY SYNC</div>
        <h2 class="greeting-main" id="greeting-main">GOOD DAY, VISITOR</h2>
        <div class="vis-anim-wrap">
            <div class="vis-anim-sweep"></div>
        </div>
        <div class="countdown-strip">
            <span class="countdown-label" id="timer-text">LAUNCHING PORTFOLIO IN 8s</span>
            <div class="countdown-bar-bg">
                <div class="countdown-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- Circular Command Trigger On Mountain -->
    <div class="circular-launcher">
        <div class="launcher-menu" id="launcher-menu">
            <div class="menu-title">// COMMAND &amp; LAUNCH MATRIX</div>

            <button class="launch-btn" onclick="openPortfolio()">
                <span>PUBLIC PORTFOLIO</span>
                <span>➔</span>
            </button>

            <button class="launch-btn secure" onclick="openAuth()">
                <span>ENCRYPTED HUB [LOCK]</span>
                <span>⚿</span>
            </button>

            <button class="launch-btn" onclick="toggleStoreSubdrawer()">
                <span>SITES STORE (3)</span>
                <span id="store-arrow">▼</span>
            </button>

            <div class="store-subdrawer" id="store-subdrawer">
                <button class="sub-site-btn" onclick="launchSite('portfolio.html')">
                    01 · PORTFOLIO SITE (Interactive Builds)
                </button>
                <button class="sub-site-btn" onclick="launchSite('https://jayakumar-2004.github.io/Sentinel-Web-Command/')">
                    02 · RAKSHA-SURAKSHA WEB (Live Terminal)
                </button>
                <button class="sub-site-btn" onclick="openAuth()">
                    03 · STARK MASTER OS (Encrypted Control)
                </button>
            </div>
        </div>

        <button class="core-orb-btn" id="core-orb-btn" onclick="toggleLauncherMenu()" aria-label="Toggle Navigation Hub">
            <div class="orb-icon" id="orb-icon">❖</div>
            <span class="orb-tag">MENU</span>
        </button>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal">
        <div class="auth-card">
            <h3>ENCRYPTED HUB LOCK</h3>
            <p style="font-size: 0.74rem; color: #9ec5e8;">ENTER MASTER PASSPHRASE</p>
            <input type="password" id="gate-pass" placeholder="••••••••" maxlength="32">
            <div style="display: flex; gap: 10px;">
                <button class="launch-btn" style="flex: 1; justify-content: center;" onclick="closeAuth()">CANCEL</button>
                <button class="launch-btn" style="flex: 1; justify-content: center; border-color: var(--neon-green); color: var(--neon-green);" onclick="validatePass()">UNLOCK</button>
            </div>
            <div id="auth-error" style="color: var(--neon-red); font-size: 0.75rem; margin-top: 10px; display: none;">[ ACCESS DENIED ]</div>
        </div>
    </div>

    <script>
        // 0: Clear Clouds (Default), 1: Heavy Cloudy, 2: Rain
        let weatherState = 0; 
        const weatherLabels = ["Clear Clouds", "Heavy Cloudy", "Live Rain"];
        let currentHeading = null;
        let currentLocLabel = "Nelamangala";
        let isRedirecting = false;

        function applySkyAndWeatherClasses() {
            const h = new Date().getHours();
            document.body.classList.remove("sky-day", "sky-evening", "sky-night", "weather-clear", "weather-cloudy", "weather-rain");

            if (h >= 5 && h < 17) document.body.classList.add("sky-day");
            else if (h >= 17 && h < 20) document.body.classList.add("sky-evening");
            else document.body.classList.add("sky-night");

            if (weatherState === 0) document.body.classList.add("weather-clear");
            else if (weatherState === 1) document.body.classList.add("weather-cloudy");
            else document.body.classList.add("weather-rain");

            document.getElementById("weather-display").innerText = weatherLabels[weatherState];
        }

        function cycleWeather() {
            weatherState = (weatherState + 1) % 3;
            applySkyAndWeatherClasses();
        }

        // Tap on sky also cycles weather
        document.getElementById("sky-viewport").addEventListener("click", cycleWeather);

        function headingToCardinal(deg) {
            if (typeof deg !== "number" || Number.isNaN(deg)) return "--°";
            const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            const idx = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
            return `${Math.round(deg)}° ${dirs[idx]}`;
        }

        function updateLocDirText() {
            document.getElementById("loc-dir-display").innerText = `${currentLocLabel} · ${headingToCardinal(currentHeading)}`;
        }

        function updateClockAndGreeting() {
            const now = new Date();
            const h = now.getHours();

            document.getElementById("date-full-display").innerText = now.toLocaleDateString("en-GB", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            document.getElementById("time-12h-display").innerText = now.toLocaleTimeString("en-US", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            });

            let greet = "GOOD MORNING, VISITOR";
            if (h >= 12 && h < 17) greet = "GOOD AFTERNOON, VISITOR";
            else if (h >= 17 && h < 21) greet = "GOOD EVENING, VISITOR";
            else if (h >= 21 || h < 5) greet = "GOOD NIGHT, VISITOR";

            document.getElementById("greeting-main").innerText = greet;
            applySkyAndWeatherClasses();
            updateLocDirText();
        }

        updateClockAndGreeting();
        setInterval(updateClockAndGreeting, 1000);

        window.addEventListener("deviceorientationabsolute", (e) => {
            if (typeof e.alpha === "number") {
                currentHeading = (360 - e.alpha) % 360;
                updateLocDirText();
            }
        }, true);

        window.addEventListener("deviceorientation", (e) => {
            if (currentHeading === null && typeof e.webkitCompassHeading === "number") {
                currentHeading = e.webkitCompassHeading;
                updateLocDirText();
            }
        }, true);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(2);
                    const lon = pos.coords.longitude.toFixed(2);
                    currentLocLabel = `${lat}°N, ${lon}°E`;
                    if (typeof pos.coords.heading === "number" && !Number.isNaN(pos.coords.heading)) {
                        currentHeading = pos.coords.heading;
                    }
                    updateLocDirText();
                },
                () => {
                    currentLocLabel = "Nelamangala";
                    updateLocDirText();
                },
                { timeout: 6000 }
            );
        }

        /* --- REALISTIC RAIN DROP & SPLASH ENGINE --- */
        const canvas = document.getElementById("rain-canvas");
        const ctx = canvas.getContext("2d");
        let cw, ch;

        function resizeCanvas() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight * 0.82; // strictly under the clouds
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        const dropCount = 130;
        const drops = [];
        const splashes = [];

        class Drop {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * (cw + 120) - 60;
                this.y = initial ? Math.random() * ch : -20; // starts at top of canvas (cloud underbelly)
                this.z = Math.random() * 0.8 + 0.2; // depth factor (0.2 = far/slow, 1 = near/fast)
                this.length = (14 + Math.random() * 12) * this.z;
                this.speed = (16 + Math.random() * 10) * this.z;
                this.angle = 0.12; // slight wind slant
                this.alpha = (0.25 + Math.random() * 0.45) * this.z;
                this.hitY = ch - 50 + (Math.random() * 30); // hits near bottom road
            }

            update() {
                this.x += this.speed * this.angle;
                this.y += this.speed;

                if (this.y >= this.hitY) {
                    // Create subtle ground splash ripple
                    if (Math.random() < 0.4) {
                        splashes.push(new Splash(this.x, this.hitY, this.alpha));
                    }
                    this.reset(false);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(180, 225, 255, ${this.alpha})`;
                ctx.lineWidth = 1.2 * this.z;
                ctx.lineCap = "round";
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - (this.length * this.angle), this.y - this.length);
                ctx.stroke();
            }
        }

        class Splash {
            constructor(x, y, alpha) {
                this.x = x;
                this.y = y;
                this.r = 1;
                this.maxR = 6 + Math.random() * 5;
                this.alpha = alpha;
            }

            update() {
                this.r += 0.8;
                this.alpha -= 0.05;
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(180, 230, 255, ${this.alpha})`;
                ctx.lineWidth = 0.8;
                ctx.ellipse(this.x, this.y, this.r * 1.6, this.r * 0.6, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        for (let i = 0; i < dropCount; i++) {
            drops.push(new Drop());
        }

        function renderRain() {
            ctx.clearRect(0, 0, cw, ch);

            if (weatherState === 2) { // only animate and render when Rain is active
                for (let i = 0; i < drops.length; i++) {
                    drops[i].update();
                    drops[i].draw();
                }

                for (let i = splashes.length - 1; i >= 0; i--) {
                    splashes[i].update();
                    splashes[i].draw();
                    if (splashes[i].alpha <= 0) {
                        splashes.splice(i, 1);
                    }
                }
            }

            requestAnimationFrame(renderRain);
        }
        renderRain();

        /* --- 8-SECOND AUTO REDIRECT --- */
        let remainingSeconds = 8;
        const timerTextEl = document.getElementById("timer-text");
        const countdownInterval = setInterval(() => {
            remainingSeconds--;
            if (remainingSeconds > 0 && timerTextEl) {
                timerTextEl.innerText = `LAUNCHING PORTFOLIO IN ${remainingSeconds}s`;
            } else if (remainingSeconds <= 0) {
                clearInterval(countdownInterval);
                openPortfolio();
            }
        }, 1000);

        function openPortfolio() {
            if (isRedirecting) return;
            isRedirecting = true;
            clearInterval(countdownInterval);
            window.location.href = "portfolio.html";
        }

        function toggleLauncherMenu() {
            clearInterval(countdownInterval);
            if (timerTextEl) timerTextEl.innerText = "AUTO-REDIRECT PAUSED";
            const menu = document.getElementById("launcher-menu");
            const icon = document.getElementById("orb-icon");
            menu.classList.toggle("open");
            icon.style.transform = menu.classList.contains("open") ? "rotate(90deg)" : "rotate(0deg)";
        }

        function toggleStoreSubdrawer() {
            const sub = document.getElementById("store-subdrawer");
            const arr = document.getElementById("store-arrow");
            sub.classList.toggle("active");
            arr.innerText = sub.classList.contains("active") ? "▲" : "▼";
        }

        function launchSite(url) {
            if (url.startsWith("http")) window.open(url, "_blank", "noopener,noreferrer");
            else window.location.href = url;
        }

        function openAuth() {
            clearInterval(countdownInterval);
            document.getElementById("auth-modal").style.display = "flex";
            document.getElementById("launcher-menu").classList.remove("open");
            document.getElementById("gate-pass").focus();
        }

        function closeAuth() {
            document.getElementById("auth-modal").style.display = "none";
            document.getElementById("auth-error").style.display = "none";
        }

        function validatePass() {
            const pass = document.getElementById("gate-pass").value;
            if (pass === "Jinufolio@2026" || pass === "2026") {
                window.location.href = "dashboard.html";
            } else {
                document.getElementById("auth-error").style.display = "block";
            }
        }
    </script>
</body>
</html>
