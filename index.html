<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JINUTECH | Cyber-Physical Environment Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-green: #00ffaa;
            --neon-amber: #ffaa00;
            --neon-red: #ff0044;
            --panel-bg: rgba(4, 11, 24, 0.96);
            --border-glow: rgba(0, 243, 255, 0.4);
            --font-hud: 'Share Tech Mono', monospace;
            --font-title: 'Orbitron', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #02050b;
            font-family: var(--font-hud);
            color: #d8ecff;
        }

        /* --- PROCEDURAL SKY --- */
        .sky-viewport {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: linear-gradient(180deg, #104882 0%, #2f7ec9 45%, #76b5eb 80%, #b8dbf9 100%);
            transition: background 0.8s ease, filter 0.6s ease;
        }

        body.sky-evening .sky-viewport {
            background: linear-gradient(180deg, #161033 0%, #4a214d 38%, #a04351 70%, #f08953 100%);
        }

        body.sky-night .sky-viewport {
            background: linear-gradient(180deg, #020611 0%, #061426 50%, #0d2745 100%);
        }

        body.weather-clear .sky-viewport { filter: brightness(1.04) saturate(1.08); }
        body.weather-cloudy .sky-viewport { filter: saturate(0.85) brightness(0.86); }
        body.weather-rain .sky-viewport { filter: brightness(0.58) saturate(0.55); }

        /* Celestial Bodies */
        .celestial-sun, .celestial-moon {
            position: fixed;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
            will-change: transform, opacity;
            transition: opacity 0.8s ease;
        }

        .celestial-sun {
            width: 78px;
            height: 78px;
            top: 16%;
            right: 14%;
            background: radial-gradient(circle, #ffffff 12%, #fff1a8 35%, #ffaa22 75%, rgba(255,160,0,0) 100%);
            opacity: 1;
        }

        .celestial-moon {
            width: 66px;
            height: 66px;
            top: 16%;
            left: 14%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d8e5f2 55%, #90a8c0 100%);
            opacity: 0;
        }

        body.sky-night .celestial-sun, body.sky-evening .celestial-sun { opacity: 0; }
        body.sky-night .celestial-moon, body.sky-evening .celestial-moon { opacity: 0.95; }
        body.weather-rain .celestial-sun, body.weather-rain .celestial-moon { opacity: 0.08; }

        /* --- SMOOTH GPU CLOUD LAYERS (NO HEAVY SVG TURBULENCE) --- */
        .cloud-stage {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .cloud-band {
            position: absolute;
            left: -40vw;
            width: 180vw;
            height: 22vh;
            top: 7%;
            border-radius: 999px;
            background:
                radial-gradient(ellipse 22% 65% at 18% 55%, rgba(255,255,255,0.48), transparent 72%),
                radial-gradient(ellipse 28% 75% at 45% 45%, rgba(235,246,255,0.52), transparent 75%),
                radial-gradient(ellipse 24% 60% at 75% 58%, rgba(220,236,250,0.45), transparent 72%);
            filter: blur(14px);
            will-change: transform, opacity;
            animation: driftLeft 70s linear infinite;
            transition: opacity 0.8s ease, filter 0.8s ease;
        }

        .cloud-band.fg {
            top: 14%;
            height: 18vh;
            opacity: 0.35;
            filter: blur(18px);
            animation: driftRight 48s linear infinite;
        }

        body.weather-clear .cloud-band { opacity: 0.45; }
        body.weather-clear .cloud-band.fg { opacity: 0.3; }

        body.weather-cloudy .cloud-band {
            opacity: 0.88;
            filter: blur(14px) brightness(0.78);
        }
        body.weather-cloudy .cloud-band.fg {
            opacity: 0.75;
            filter: blur(18px) brightness(0.74);
        }

        body.weather-rain .cloud-band {
            opacity: 0.96;
            filter: blur(14px) brightness(0.38);
        }
        body.weather-rain .cloud-band.fg {
            opacity: 0.88;
            filter: blur(18px) brightness(0.34);
        }

        body.sky-night .cloud-band { filter: blur(14px) brightness(0.28); }
        body.sky-night .cloud-band.fg { filter: blur(18px) brightness(0.24); }

        @keyframes driftLeft {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-22vw, 0, 0); }
        }

        @keyframes driftRight {
            0% { transform: translate3d(-18vw, 0, 0); }
            100% { transform: translate3d(12vw, 0, 0); }
        }

        /* --- CLOUD-UNDERBELLY RAIN CANVAS --- */
        .rain-canvas-stage {
            position: fixed;
            top: 19vh;
            left: 0;
            width: 100vw;
            height: 81vh;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.weather-rain .rain-canvas-stage { opacity: 1; }

        /* --- MOUNTAIN RIDGES --- */
        .mountain-container {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 66px;
            width: 100%;
            height: 35vh;
            z-index: 5;
            pointer-events: none;
        }

        .mountain-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- TWO-WAY TRACKS & HIGHWAY --- */
        .transit-infrastructure {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 82px;
            z-index: 6;
            pointer-events: none;
        }

        .rail-corridor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 28px;
            background: #061018;
            border-top: 1px solid rgba(0, 243, 255, 0.25);
        }

        .rail-track {
            position: absolute;
            left: 0;
            width: 100%;
            height: 5px;
            border-top: 1px solid #6b91a6;
            border-bottom: 1px solid #6b91a6;
            background: repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(0, 243, 255, 0.22) 10px, rgba(0, 243, 255, 0.22) 13px);
        }

        .rail-upper { top: 6px; }
        .rail-lower { top: 18px; }

        .train-ltr {
            position: absolute;
            top: -4px;
            left: -240px;
            width: 210px;
            height: 10px;
            display: flex;
            gap: 2px;
            will-change: transform;
            animation: trainLTR 16s linear infinite;
        }

        .train-rtl {
            position: absolute;
            top: 8px;
            left: 100vw;
            width: 210px;
            height: 10px;
            display: flex;
            gap: 2px;
            will-change: transform;
            animation: trainRTL 19s linear infinite 2s;
        }

        .train-car {
            flex: 1;
            height: 100%;
            background: linear-gradient(180deg, #00f3ff, #005588);
            border-radius: 2px;
            font-size: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 800;
        }

        .train-engine-right {
            width: 28px;
            background: #ffaa00;
            border-radius: 2px 5px 2px 2px;
        }

        .train-engine-left {
            width: 28px;
            background: #00ffaa;
            border-radius: 5px 2px 2px 2px;
        }

        @keyframes trainLTR {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(135vw, 0, 0); }
        }

        @keyframes trainRTL {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-135vw, 0, 0); }
        }

        .highway-road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 54px;
            background: #081119;
            border-top: 2px solid rgba(0, 243, 255, 0.35);
        }

        .highway-divider {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 2px;
            background: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255, 255, 255, 0.45) 20px, rgba(255, 255, 255, 0.45) 40px);
            transform: translateY(-50%);
        }

        .lane-upper {
            position: absolute;
            top: 4px;
            left: 0;
            width: 100%;
            height: 20px;
            overflow: hidden;
        }

        .lane-lower {
            position: absolute;
            bottom: 4px;
            left: 0;
            width: 100%;
            height: 20px;
            overflow: hidden;
        }

        .vehicle-car {
            position: absolute;
            top: 5px;
            width: 34px;
            height: 9px;
            border-radius: 3px;
            will-change: transform;
        }

        .v-upper-rtl {
            left: 100vw;
            background: #00ffaa;
            animation: laneRTL 12s linear infinite;
        }

        .v-lower-ltr {
            left: -50px;
            background: #ff0044;
            animation: laneLTR 14s linear infinite 2s;
        }

        @keyframes laneRTL {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-130vw, 0, 0); }
        }

        @keyframes laneLTR {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(130vw, 0, 0); }
        }

        /* --- TELEMETRY HEADER --- */
        .hud-header {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(3, 10, 22, 0.88);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            z-index: 20;
        }

        .brand-node h1 {
            font-family: var(--font-title);
            font-size: clamp(1.05rem, 3.4vw, 1.65rem);
            letter-spacing: 1.5px;
            color: #ffffff;
        }

        .brand-node span {
            display: block;
            color: var(--neon-green);
            font-size: clamp(0.7rem, 1.9vw, 0.9rem);
            letter-spacing: 0.6px;
            margin-top: 2px;
        }

        .telemetry-cluster {
            display: flex;
            gap: 8px;
        }

        .telemetry-item {
            background: rgba(0, 243, 255, 0.06);
            border: 1px solid rgba(0, 243, 255, 0.24);
            padding: 5px 9px;
            border-radius: 7px;
            min-width: 0;
            text-align: right;
            cursor: pointer;
            overflow: hidden;
        }

        .telemetry-item:hover {
            background: rgba(0, 243, 255, 0.14);
            border-color: var(--neon-cyan);
        }

        .telemetry-item span {
            display: block;
            font-size: 0.58rem;
            color: var(--neon-cyan);
            letter-spacing: 0.6px;
            white-space: nowrap;
        }

        .telemetry-item b {
            display: block;
            color: #ffffff;
            font-size: clamp(0.68rem, 1.85vw, 0.92rem);
            font-family: var(--font-title);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 640px) {
            .hud-header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                padding: 9px 10px;
            }

            .brand-node {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 8px;
            }

            .telemetry-cluster {
                display: grid;
                grid-template-columns: 0.95fr 1.15fr 0.95fr;
                gap: 6px;
            }

            .telemetry-item {
                padding: 5px 6px;
                text-align: center;
            }
        }

        /* Center Greeting & Progress */
        .center-announcer {
            position: fixed;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            pointer-events: none;
            width: 100%;
            padding: 0 14px;
        }

        .greeting-sub {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .greeting-main {
            font-family: var(--font-title);
            font-size: clamp(1.4rem, 5vw, 3rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.85);
            letter-spacing: 1.5px;
            line-height: 1.15;
        }

        .vis-anim-wrap {
            width: min(210px, 56vw);
            height: 7px;
            margin: 11px auto 0;
            border-radius: 999px;
            background: rgba(2, 10, 20, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.45);
            overflow: hidden;
            position: relative;
        }

        .vis-anim-sweep {
            position: absolute;
            top: 0;
            left: -35%;
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-green), transparent);
            will-change: transform;
            animation: sweepBar 2.2s ease-in-out infinite;
        }

        @keyframes sweepBar {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(385%, 0, 0); }
        }

        .countdown-strip {
            margin: 12px auto 0;
            width: min(200px, 52vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .countdown-label {
            font-size: 0.68rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
        }

        .countdown-bar-bg {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        .countdown-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
            animation: timerFill 8s linear forwards;
        }

        .countdown-bar-fill.paused {
            animation-play-state: paused;
        }

        @keyframes timerFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* --- CIRCULAR LAUNCH BUTTON --- */
        .circular-launcher {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .core-orb-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.28) 0%, rgba(4, 11, 24, 0.96) 75%);
            border: 2px solid var(--neon-cyan);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .core-orb-btn:active {
            transform: scale(0.96);
            border-color: var(--neon-green);
        }

        .orb-icon {
            font-size: 18px;
            color: var(--neon-cyan);
            transition: transform 0.25s ease;
        }

        .orb-tag {
            font-size: 8px;
            letter-spacing: 1px;
            color: var(--neon-green);
            margin-top: 2px;
            font-weight: bold;
        }

        .launcher-menu {
            position: absolute;
            bottom: 74px;
            width: min(92vw, 360px);
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 14px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .launcher-menu.open { display: flex; }

        .menu-title {
            font-size: 0.72rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-align: center;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 6px;
        }

        .launch-btn {
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: var(--font-hud);
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .launch-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        .launch-btn.secure {
            border-color: rgba(255, 0, 68, 0.5);
            background: rgba(255, 0, 68, 0.08);
        }

        .launch-btn.secure:hover {
            background: var(--neon-red);
            color: #fff;
        }

        .store-subdrawer {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 2px;
            padding: 8px;
            background: rgba(0, 5, 12, 0.8);
            border-radius: 6px;
            border: 1px dashed rgba(0, 243, 255, 0.3);
        }

        .store-subdrawer.active { display: flex; }

        .sub-site-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.22);
            color: #aae0fa;
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 0.74rem;
            cursor: pointer;
            text-align: left;
        }

        .sub-site-btn:hover {
            background: rgba(0, 255, 170, 0.2);
            color: #fff;
        }

        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 5, 12, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .auth-card {
            width: min(92vw, 360px);
            margin: 0 auto;
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .auth-card input {
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--border-glow);
            padding: 10px;
            text-align: center;
            font-family: var(--font-hud);
            font-size: 0.95rem;
            color: var(--neon-cyan);
            margin: 12px 0;
            letter-spacing: 3px;
            outline: none;
            border-radius: 6px;
        }

        .btn-unlock-contrast {
            background: #071926 !important;
            border: 1px solid var(--neon-green) !important;
            color: var(--neon-green) !important;
            font-weight: bold;
        }
    </style>
</head>
<body class="sky-day weather-clear">

    <div class="sky-viewport" id="sky-viewport"></div>
    <div class="celestial-sun"></div>
    <div class="celestial-moon"></div>

    <div class="cloud-stage">
        <div class="cloud-band"></div>
        <div class="cloud-band fg"></div>
    </div>

    <canvas id="rain-canvas" class="rain-canvas-stage"></canvas>

    <div class="mountain-container">
        <svg class="mountain-svg" viewBox="0 0 1440 450" preserveAspectRatio="none">
            <path d="M0,180 Q220,90 460,160 T920,110 T1440,150 L1440,450 L0,450 Z" fill="#183a48" opacity="0.45" />
            <path d="M0,230 Q160,130 380,210 T760,150 T1140,200 T1440,160 L1440,450 L0,450 Z" fill="#102f35" opacity="0.75" />
            <path d="M0,270 C220,190 380,290 640,210 C880,140 1080,260 1440,200 L1440,450 L0,450 Z" fill="#0b2424" opacity="0.9" />
            <path d="M0,320 C320,240 620,330 920,270 C1200,210 1340,300 1440,250 L1440,450 L0,450 Z" fill="#051614" />
        </svg>
    </div>

    <div class="transit-infrastructure">
        <div class="rail-corridor">
            <div class="rail-track rail-upper"></div>
            <div class="train-ltr">
                <div class="train-car">NET</div>
                <div class="train-car">HTML</div>
                <div class="train-car">CSS</div>
                <div class="train-car train-engine-right">SYS</div>
            </div>

            <div class="rail-track rail-lower"></div>
            <div class="train-rtl">
                <div class="train-car train-engine-left">AI</div>
                <div class="train-car">JS</div>
                <div class="train-car">PY</div>
                <div class="train-car">SEC</div>
            </div>
        </div>

        <div class="highway-road">
            <div class="lane-upper">
                <div class="vehicle-car v-upper-rtl"></div>
            </div>
            <div class="highway-divider"></div>
            <div class="lane-lower">
                <div class="vehicle-car v-lower-ltr"></div>
            </div>
        </div>
    </div>

    <header class="hud-header">
        <div class="brand-node">
            <h1>JINUTECH</h1>
            <span id="date-full-display">-- ---------- ----</span>
        </div>

        <div class="telemetry-cluster">
            <div class="telemetry-item">
                <span>12H TIME</span>
                <b id="time-12h-display">--:--:-- --</b>
            </div>
            <div class="telemetry-item">
                <span>LOC &amp; DIR</span>
                <b id="loc-dir-display">Nelamangala</b>
            </div>
            <div class="telemetry-item" onclick="cycleWeather()" title="Tap to toggle weather">
                <span>WEATHER (TAP)</span>
                <b id="weather-display">Clear Clouds</b>
            </div>
        </div>
    </header>

    <div class="center-announcer">
        <div class="greeting-sub">// VISITOR TELEMETRY SYNC</div>
        <h2 class="greeting-main" id="greeting-main">GOOD DAY, VISITOR</h2>
        <div class="vis-anim-wrap">
            <div class="vis-anim-sweep"></div>
        </div>
        <div class="countdown-strip">
            <span class="countdown-label" id="timer-text">LAUNCHING PORTFOLIO IN 8s</span>
            <div class="countdown-bar-bg">
                <div class="countdown-bar-fill" id="timer-fill"></div>
            </div>
        </div>
    </div>

    <div class="circular-launcher">
        <div class="launcher-menu" id="launcher-menu">
            <div class="menu-title">// COMMAND &amp; LAUNCH MATRIX</div>

            <button class="launch-btn" onclick="openPortfolio()">
                <span>PUBLIC PORTFOLIO</span>
                <span>➔</span>
            </button>

            <button class="launch-btn secure" onclick="openAuth()">
                <span>MASTER CONTROL [LOCK]</span>
                <span>⚿</span>
            </button>

            <button class="launch-btn" onclick="toggleStoreSubdrawer()">
                <span>SITES STORE (3)</span>
                <span id="store-arrow">▼</span>
            </button>

            <div class="store-subdrawer" id="store-subdrawer">
                <button class="sub-site-btn" onclick="launchSite('portfolio.html')">
                    01 · PORTFOLIO SITE (Interactive Builds)
                </button>
                <button class="sub-site-btn" onclick="launchSite('master.html')">
                    02 · MASTER CONTROL CONSOLE (master.html)
                </button>
                <button class="sub-site-btn" onclick="launchSite('https://jayakumar-2004.github.io/Sentinel-Web-Command/')">
                    03 · RAKSHA-SURAKSHA WEB (Live Terminal)
                </button>
            </div>
        </div>

        <button class="core-orb-btn" id="core-orb-btn" onclick="toggleLauncherMenu()" aria-label="Toggle Navigation Hub">
            <div class="orb-icon" id="orb-icon">❖</div>
            <span class="orb-tag">MENU</span>
        </button>
    </div>

    <div id="auth-modal">
        <div class="auth-card">
            <h3>MASTER CONTROL GATE</h3>
            <p id="auth-sub" style="font-size: 0.74rem; color: #9ec5e8; margin-top: 4px;">ENTER MASTER PASSPHRASE</p>
            <input type="password" id="gate-pass" placeholder="••••••••" maxlength="64" autocomplete="off">
            <div id="gate-confirm-wrap" style="display:none;">
                <input type="password" id="gate-pass-confirm" placeholder="CONFIRM PASSPHRASE" maxlength="64" autocomplete="off">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="launch-btn" style="flex: 1; justify-content: center;" onclick="closeAuth()">CANCEL</button>
                <button id="btn-auth-submit" class="launch-btn btn-unlock-contrast" style="flex: 1; justify-content: center;" onclick="validatePass()">UNLOCK</button>
            </div>
            <div id="auth-error" style="color: var(--neon-red); font-size: 0.75rem; margin-top: 10px; display: none;"></div>
        </div>
    </div>

    <script>
        const MASTER_HASH_STORAGE_KEY = "jinutech_master_sha256";
        const MASTER_SESSION_KEY = "jinutech_master_session";

        let weatherState = 0;
        const weatherLabels = ["Clear Clouds", "Heavy Cloudy", "Live Rain"];
        let currentHeading = null;
        let currentLocLabel = "Nelamangala";
        let lastSkyBucket = "";
        let isRedirecting = false;
        let isSettingInitialPass = false;

        function getSkyBucket(hour) {
            if (hour >= 5 && hour < 17) return "sky-day";
            if (hour >= 17 && hour < 20) return "sky-evening";
            return "sky-night";
        }

        function applySkyAndWeatherClasses(hour) {
            const nextSky = getSkyBucket(hour);
            if (nextSky !== lastSkyBucket) {
                document.body.classList.remove("sky-day", "sky-evening", "sky-night");
                document.body.classList.add(nextSky);
                lastSkyBucket = nextSky;
            }

            document.body.classList.remove("weather-clear", "weather-cloudy", "weather-rain");
            if (weatherState === 0) document.body.classList.add("weather-clear");
            else if (weatherState === 1) document.body.classList.add("weather-cloudy");
            else document.body.classList.add("weather-rain");

            document.getElementById("weather-display").textContent = weatherLabels[weatherState];
        }

        function cycleWeather() {
            pauseRedirect();
            weatherState = (weatherState + 1) % 3;
            applySkyAndWeatherClasses(new Date().getHours());
        }

        document.getElementById("sky-viewport").addEventListener("click", cycleWeather);

        function headingToCardinal(deg) {
            if (typeof deg !== "number" || Number.isNaN(deg)) return "";
            const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            const idx = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
            return ` · ${Math.round(deg)}° ${dirs[idx]}`;
        }

        function updateLocDirText() {
            const label = `${currentLocLabel}${headingToCardinal(currentHeading)}`;
            document.getElementById("loc-dir-display").textContent = label;
        }

        function updateClockAndGreeting() {
            const now = new Date();
            const h = now.getHours();

            document.getElementById("date-full-display").textContent = now.toLocaleDateString("en-GB", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            document.getElementById("time-12h-display").textContent = now.toLocaleTimeString("en-US", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            });

            let greet = "GOOD MORNING, VISITOR";
            if (h >= 12 && h < 17) greet = "GOOD AFTERNOON, VISITOR";
            else if (h >= 17 && h < 21) greet = "GOOD EVENING, VISITOR";
            else if (h >= 21 || h < 5) greet = "GOOD NIGHT, VISITOR";

            document.getElementById("greeting-main").textContent = greet;
            applySkyAndWeatherClasses(h);
        }

        updateClockAndGreeting();
        updateLocDirText();
        setInterval(updateClockAndGreeting, 1000);

        window.addEventListener("deviceorientationabsolute", (e) => {
            if (typeof e.alpha === "number") {
                currentHeading = (360 - e.alpha) % 360;
                updateLocDirText();
            }
        }, true);

        window.addEventListener("deviceorientation", (e) => {
            if (currentHeading === null && typeof e.webkitCompassHeading === "number") {
                currentHeading = e.webkitCompassHeading;
                updateLocDirText();
            }
        }, true);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(1);
                    const lon = pos.coords.longitude.toFixed(1);
                    currentLocLabel = `${lat}°N,${lon}°E`;
                    if (typeof pos.coords.heading === "number" && !Number.isNaN(pos.coords.heading)) {
                        currentHeading = pos.coords.heading;
                    }
                    updateLocDirText();
                },
                () => {
                    currentLocLabel = "Nelamangala";
                    updateLocDirText();
                },
                { timeout: 5000 }
            );
        }

        /* --- LIGHTWEIGHT RAIN & SPLASH ENGINE --- */
        const canvas = document.getElementById("rain-canvas");
        const ctx = canvas.getContext("2d");
        let cw = 0;
        let ch = 0;

        function resizeCanvas() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = Math.floor(window.innerHeight * 0.81);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        const dropCount = 85;
        const drops = [];
        const splashes = [];

        class Drop {
            constructor() {
                this.reset(true);
            }

            reset(initial) {
                this.x = Math.random() * (cw + 80) - 40;
                this.y = initial ? Math.random() * ch : -16;
                this.z = Math.random() * 0.75 + 0.25;
                this.length = (14 + Math.random() * 12) * this.z;
                this.speed = (16 + Math.random() * 9) * this.z;
                this.angle = 0.12;
                this.alpha = (0.4 + Math.random() * 0.4) * this.z;
                this.hitY = ch - 46 + (Math.random() * 22);
            }

            update() {
                this.x += this.speed * this.angle;
                this.y += this.speed;
                if (this.y >= this.hitY) {
                    if (splashes.length < 30 && Math.random() < 0.35) {
                        splashes.push({ x: this.x, y: this.hitY, r: 1, alpha: Math.min(0.9, this.alpha + 0.15) });
                    }
                    this.reset(false);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(195, 235, 255, ${this.alpha})`;
                ctx.lineWidth = 1.4 * this.z;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - (this.length * this.angle), this.y - this.length);
                ctx.stroke();
            }
        }

        for (let i = 0; i < dropCount; i++) {
            drops.push(new Drop());
        }

        function renderRain() {
            if (weatherState === 2) {
                ctx.clearRect(0, 0, cw, ch);
                for (let i = 0; i < drops.length; i++) {
                    drops[i].update();
                    drops[i].draw();
                }
                for (let i = splashes.length - 1; i >= 0; i--) {
                    const s = splashes[i];
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(195, 238, 255, ${s.alpha})`;
                    ctx.lineWidth = 0.9;
                    ctx.ellipse(s.x, s.y, s.r * 1.6, s.r * 0.6, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    s.r += 0.9;
                    s.alpha -= 0.06;
                    if (s.alpha <= 0) splashes.splice(i, 1);
                }
            } else {
                ctx.clearRect(0, 0, cw, ch);
            }
            requestAnimationFrame(renderRain);
        }
        requestAnimationFrame(renderRain);

        /* --- REDIRECT CONTROL --- */
        let remainingSeconds = 8;
        let redirectPaused = false;
        const timerTextEl = document.getElementById("timer-text");
        const timerFillEl = document.getElementById("timer-fill");

        function pauseRedirect() {
            if (!redirectPaused) {
                redirectPaused = true;
                if (timerFillEl) timerFillEl.classList.add("paused");
                if (timerTextEl && !isRedirecting) timerTextEl.textContent = "AUTO-REDIRECT PAUSED";
            }
        }

        const countdownInterval = setInterval(() => {
            if (redirectPaused || isRedirecting) return;
            remainingSeconds--;
            if (remainingSeconds > 0) {
                if (timerTextEl) timerTextEl.textContent = `LAUNCHING PORTFOLIO IN ${remainingSeconds}s`;
            } else {
                clearInterval(countdownInterval);
                openPortfolio();
            }
        }, 1000);

        function openPortfolio() {
            if (isRedirecting) return;
            isRedirecting = true;
            clearInterval(countdownInterval);
            window.location.href = "portfolio.html";
        }

        function toggleLauncherMenu() {
            pauseRedirect();
            const menu = document.getElementById("launcher-menu");
            const icon = document.getElementById("orb-icon");
            menu.classList.toggle("open");
            icon.style.transform = menu.classList.contains("open") ? "rotate(90deg)" : "rotate(0deg)";
        }

        function toggleStoreSubdrawer() {
            const sub = document.getElementById("store-subdrawer");
            const arr = document.getElementById("store-arrow");
            sub.classList.toggle("active");
            arr.textContent = sub.classList.contains("active") ? "▲" : "▼";
        }

        function launchSite(url) {
            if (url.startsWith("http")) window.open(url, "_blank", "noopener,noreferrer");
            else window.location.href = url;
        }

        async function sha256Hex(text) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
        }

        function openAuth() {
            pauseRedirect();
            const hasDigest = Boolean(localStorage.getItem(MASTER_HASH_STORAGE_KEY));
            isSettingInitialPass = !hasDigest;

            document.getElementById("auth-sub").textContent = isSettingInitialPass
                ? "SET LOCAL PASSPHRASE (SHA-256)"
                : "ENTER MASTER PASSPHRASE";
            document.getElementById("gate-confirm-wrap").style.display = isSettingInitialPass ? "block" : "none";
            document.getElementById("btn-auth-submit").textContent = isSettingInitialPass ? "SAVE & OPEN" : "UNLOCK";
            document.getElementById("auth-error").style.display = "none";
            document.getElementById("gate-pass").value = "";
            document.getElementById("gate-pass-confirm").value = "";
            document.getElementById("auth-modal").style.display = "flex";
            document.getElementById("launcher-menu").classList.remove("open");
            document.getElementById("gate-pass").focus();
        }

        function closeAuth() {
            document.getElementById("auth-modal").style.display = "none";
            document.getElementById("auth-error").style.display = "none";
        }

        function showAuthError(msg) {
            const errEl = document.getElementById("auth-error");
            errEl.textContent = msg;
            errEl.style.display = "block";
        }

        async function validatePass() {
            const pass = document.getElementById("gate-pass").value;
            if (!pass || pass.length < 6) {
                showAuthError("[ MIN 6 CHARS REQUIRED ]");
                return;
            }

            if (isSettingInitialPass) {
                const confirmPass = document.getElementById("gate-pass-confirm").value;
                if (pass !== confirmPass) {
                    showAuthError("[ PASSPHRASES DO NOT MATCH ]");
                    return;
                }
                const digest = await sha256Hex(pass);
                localStorage.setItem(MASTER_HASH_STORAGE_KEY, digest);
                sessionStorage.setItem(MASTER_SESSION_KEY, "1");
                window.location.href = "master.html";
                return;
            }

            const storedDigest = localStorage.getItem(MASTER_HASH_STORAGE_KEY);
            const candidateDigest = await sha256Hex(pass);
            if (candidateDigest === storedDigest) {
                sessionStorage.setItem(MASTER_SESSION_KEY, "1");
                window.location.href = "master.html";
            } else {
                showAuthError("[ ACCESS DENIED ]");
            }
        }
    </script>
</body>
</html>
